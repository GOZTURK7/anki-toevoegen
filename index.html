<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anki'ye ekle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anki Ekle">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1330" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB;--surface:#FFFFFF;--ink:#121A33;--mut:#5F6A8C;--line:#DCE2F0;
  --delft:#1E3F9C;--delft-ink:#1E3F9C;--delft-soft:#E3E9F8;--tile-line:#CBD6EF;--pattern:.16;
  --oranje:#CC4F05;--oranje-ink:#FFFFFF;--oranje-soft:#FBE3D3;--ok:#1F7A51;--err:#B83434;
  --ui:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --read:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1330;--surface:#111D45;--ink:#EEF1FA;--mut:#9AA6CC;--line:#22305E;
  --delft:#6C8FF2;--delft-ink:#B3C8FF;--delft-soft:#1D2E68;--tile-line:#27397A;--pattern:.30;
  --oranje:#FF8A3D;--oranje-ink:#1F0D00;--oranje-soft:#3B2416;--ok:#5BCB95;--err:#FF8787;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--ui);font-optical-sizing:auto}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--delft);outline-offset:2px;border-radius:8px}

/* header with Delft tile band */
.top{position:relative;padding:calc(env(safe-area-inset-top) + 18px) 20px 18px;overflow:hidden}
.tiles{position:absolute;inset:0;color:var(--delft);opacity:var(--pattern);pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 10%,transparent 95%);mask-image:linear-gradient(to bottom,#000 10%,transparent 95%)}
.tiles svg{width:100%;height:100%;display:block}
.head{position:relative;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;flex:none;border-radius:13px;box-shadow:0 6px 18px -8px rgba(30,63,156,.6)}
h1{margin:0;font-size:27px;line-height:1.1;font-weight:760;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
.sub{margin:2px 0 0;font-size:14px;color:var(--mut)}
.head-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:22px;height:22px}

main{max-width:560px;margin:0 auto;padding:6px 20px 150px}
.lbl{font-size:14px;font-weight:600;color:var(--mut);margin:0 0 10px}

/* deck chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:9px 15px;font-size:15px;font-weight:550;cursor:pointer}
.chip.on{background:var(--delft);border-color:var(--delft);color:#fff}
@media (prefers-color-scheme:dark){.chip.on{color:#0A1330}}
.chip.add{background:transparent;border-style:dashed;color:var(--mut)}
.newdeck{margin-top:12px}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.note{font-size:13px;color:var(--mut);margin:8px 2px 0}

/* inputs */
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;outline:none}
.input:focus{border-color:var(--delft)}
.btn{border:0;border-radius:12px;padding:0 16px;min-height:44px;font-weight:650;cursor:pointer;background:var(--delft);color:#fff;white-space:nowrap}
@media (prefers-color-scheme:dark){.btn{color:#0A1330}}
.btn.quiet{background:transparent;color:var(--mut);border:1px solid var(--line)}

/* paste box */
.paste{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.paste:focus-within{border-color:var(--delft)}
.paste textarea{display:block;width:100%;min-height:120px;resize:vertical;border:0;outline:none;background:transparent;padding:16px 16px 8px;font:15px/1.5 -apple-system,system-ui,sans-serif}
.paste textarea::placeholder{color:var(--mut)}
.paste-bar{display:flex;align-items:center;gap:8px;padding:8px 10px 10px}
.pbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:0 14px;min-height:40px;background:var(--delft-soft);color:var(--delft-ink);font-weight:650;cursor:pointer}
.pbtn svg{width:18px;height:18px}
.tbtn{margin-left:auto;border:0;background:none;color:var(--mut);font-size:15px;padding:8px 6px;cursor:pointer}

/* card tiles */
.sum{margin:26px 2px 12px;font-size:15px;color:var(--mut)}
.sum b{color:var(--ink);font-weight:650}
.list{display:grid;gap:10px}
.tile{position:relative;background:var(--surface);border-radius:10px;padding:17px 18px 12px;box-shadow:0 0 0 1px var(--line)}
.tile::before{content:"";position:absolute;inset:5px;border:1px solid var(--tile-line);border-radius:6px;pointer-events:none}
.nl{position:relative;margin:0;font:400 18px/1.45 var(--read);font-optical-sizing:auto}
.nl mark{background:var(--delft-soft);color:var(--delft-ink);font-weight:600;border-radius:5px;padding:0 .22em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tr{position:relative;margin:6px 0 0;color:var(--mut);font-size:15px}
.foot{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;min-height:36px}
.st{font-size:13.5px;color:var(--mut);display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.st.ok{color:var(--ok)}.st.err{color:var(--err)}
.mini{font-size:14px;font-weight:600;color:var(--delft-ink);text-decoration:none;padding:7px 12px;border-radius:10px;border:1px solid var(--line)}
.tile.sent .nl,.tile.sent .tr{opacity:.5}
.tile.bad::before{border-style:dashed;border-color:var(--err);opacity:.6}
.tile.bad .nl{font:14px/1.5 -apple-system,system-ui,sans-serif;color:var(--mut);word-break:break-word}

/* bottom dock */
.dock{position:fixed;left:0;right:0;bottom:0;padding:22px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 62%,transparent)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;max-width:560px;margin:0 auto;min-height:58px;border-radius:18px;
  background:var(--oranje);color:var(--oranje-ink);font-size:18px;font-weight:720;text-decoration:none;letter-spacing:-.005em;
  box-shadow:0 12px 26px -14px rgba(204,79,5,.9)}
.cta svg{width:20px;height:20px}
.cta.off{background:var(--line);color:var(--mut);box-shadow:none;pointer-events:none}

/* settings sheet */
.scrim{position:fixed;inset:0;background:rgba(5,10,30,.45);opacity:0;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet-in{max-width:560px;margin:0 auto}
.open .scrim{opacity:1}.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet h2{margin:0;font-size:21px;font-weight:720;letter-spacing:-.01em}
.sheet h3{margin:22px 0 10px;font-size:15px;font-weight:650}
.f{margin-bottom:12px}
.f label{display:block;font-size:13.5px;color:var(--mut);margin:0 0 5px}
.f .input{background:var(--bg)}
.two{display:flex;gap:10px}.two>.f{flex:1;min-width:0}
.dk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk button{flex:none;white-space:nowrap;border:0;background:none;color:var(--err);font-size:14px;cursor:pointer;padding:6px}
.dk button:disabled{color:var(--mut);opacity:.5}
.wide{width:100%;margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:40px;font-size:15px;font-weight:600;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--delft);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#0A1330}}
.ver{margin:20px 0 0;font-size:12.5px;color:var(--mut);text-align:center}

/* toast */
.toast{position:fixed;left:20px;right:20px;bottom:calc(100px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:15px;opacity:0;transform:translateY(8px);
  transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast{transition:none}}

/* help view */
body.in-help .top,body.in-help main,body.in-help .dock{display:none}
body:not(.in-help) #help{display:none}
#help{max-width:560px;margin:0 auto;padding:0 20px 70px}
.help-top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 0 6px}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:none;color:var(--delft-ink);font-size:17px;font-weight:600;padding:8px 8px 8px 0;cursor:pointer}
.back svg{width:22px;height:22px}
.help-h1{font-size:32px;margin:4px 0 14px}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:550;cursor:pointer}
#help section{padding-top:30px;scroll-margin-top:calc(env(safe-area-inset-top) + 56px)}
#help h2{font-size:23px;font-weight:720;letter-spacing:-.01em;margin:0 0 8px}
#help h3{font-size:17px;font-weight:680;margin:0 0 4px}
#help h4{font-size:15px;font-weight:650;margin:16px 0 6px}
#help p{margin:0 0 12px;line-height:1.55}
#help .s{display:block;color:var(--mut);font-size:15px;line-height:1.45}
.cap{color:var(--mut);font-size:14.5px}
.flow{list-style:none;margin:16px 0 22px;padding:0}
.flow li{position:relative;display:flex;gap:14px;align-items:flex-start;padding-bottom:18px}
.flow li:not(:last-child)::after{content:"";position:absolute;left:17px;top:40px;bottom:2px;width:2px;background:var(--tile-line)}
.fn,.sn{flex:none;width:36px;height:36px;border-radius:11px;background:var(--delft-soft);color:var(--delft-ink);display:grid;place-items:center;font-weight:720;font-size:16px}
.flow li:last-child .fn{background:var(--oranje);color:var(--oranje-ink)}
.flow b{display:block;font-weight:680;margin-top:6px}
.fmt{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:14px;margin-top:10px}
.line{display:block;font:13.5px/1.7 ui-monospace,Menlo,monospace;word-break:break-word;background:var(--bg);border-radius:10px;padding:10px 12px}
.seg-f{background:var(--delft-soft);color:var(--delft-ink);border-radius:4px}
.seg-c{background:var(--oranje);color:var(--oranje-ink);font-weight:800;border-radius:4px;padding:0 3px}
.seg-b{background:var(--oranje-soft);border-radius:4px}
.fmt-out{display:grid;gap:8px;margin:10px 0 12px}
.fo{border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.fo small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-bottom:2px}
.fo p{margin:0!important}
.fo .nl{font:400 16px/1.45 var(--read)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.dot.f{background:var(--delft)}.dot.b{background:var(--oranje)}
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.checks label{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--line);padding:12px 14px;cursor:pointer}
.checks input{position:absolute;opacity:0;pointer-events:none}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--tile-line);margin-top:1px;display:grid;place-items:center}
.checks input:checked+.box{background:var(--ok);border-color:var(--ok)}
.checks input:checked+.box::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.checks input:focus-visible+.box{outline:2px solid var(--delft);outline-offset:2px}
.checks b{display:block;font-weight:650}
.steps{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:12px}
.steps>li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:14px}
.sb{min-width:0;flex:1}
.sb p:last-child{margin-bottom:0}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--delft);color:#fff;font-weight:650;font-size:15px;text-decoration:none;border:0;cursor:pointer;margin:2px 8px 2px 0}
@media (prefers-color-scheme:dark){.hbtn{color:#0A1330}}
.hbtn.ghost{background:transparent;color:var(--delft-ink);border:1px solid var(--line)}
.hbtn.sm{min-height:38px;padding:0 12px;font-size:14px;margin:0}
details.more{margin-top:10px}
details.more summary{cursor:pointer;color:var(--delft-ink);font-weight:600;padding:6px 0}
.instr{white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,Menlo,monospace;background:var(--bg);border-radius:10px;padding:12px;margin:6px 0 0}
.where{margin:0;padding-left:18px;color:var(--mut);font-size:14.5px}
.where li{margin-bottom:6px}
.sub{margin:8px 0;padding-left:18px;font-size:14.5px}
.sub li{margin-bottom:6px}
.map{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:6px 4px;align-items:center;margin:10px 0 12px}
.map small{font-size:12.5px;color:var(--mut)}
.mcell{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:46px;display:flex;flex-direction:column;justify-content:center}
.mcell em{font-style:normal;color:var(--mut);font-size:12px;line-height:1.2}
.marr{text-align:center;color:var(--oranje);font-weight:800}
.acts{display:grid;gap:6px;margin:8px 0 10px}
.act{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.7}
.act em{font-style:normal;color:var(--delft-ink);background:var(--delft-soft);border-radius:6px;padding:1px 6px;font-weight:600}
.path{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 0}
.path span{background:var(--delft-soft);color:var(--delft-ink);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600}
.path i{color:var(--mut);font-style:normal}
.tip{background:var(--delft-soft);border-radius:14px;padding:14px;margin:14px 0 10px}
.trig{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:10px;padding:8px 8px 8px 14px}
.kbd{font:700 15px ui-monospace,Menlo,monospace;color:var(--delft-ink)}
.faq{background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--line);margin-top:8px}
.faq summary{list-style:none;cursor:pointer;padding:14px 44px 14px 16px;font-weight:620;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:22px;font-weight:400;color:var(--mut)}
.faq[open] summary::after{content:"\2212"}
#help .faq p{padding:0 16px 14px;margin:0;color:var(--mut)}
</style>
</head>
<body>

<header class="top">
  <div class="tiles" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="delft" width="64" height="64" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="currentColor" stroke-width="1.4">
            <rect x=".5" y=".5" width="63" height="63"/>
            <path d="M.5 13A12.5 12.5 0 0 0 13 .5M51 .5A12.5 12.5 0 0 0 63.5 13M63.5 51A12.5 12.5 0 0 0 51 63.5M13 63.5A12.5 12.5 0 0 0 .5 51"/>
            <path d="M.5 7A6.5 6.5 0 0 0 7 .5M57 .5A6.5 6.5 0 0 0 63.5 7M63.5 57A6.5 6.5 0 0 0 57 63.5M7 63.5A6.5 6.5 0 0 0 .5 57"/>
          </g>
          <g fill="currentColor">
            <ellipse cx="32" cy="23.5" rx="3.6" ry="7"/>
            <ellipse cx="32" cy="40.5" rx="3.6" ry="7"/>
            <ellipse cx="23.5" cy="32" rx="7" ry="3.6"/>
            <ellipse cx="40.5" cy="32" rx="7" ry="3.6"/>
          </g>
          <circle cx="32" cy="32" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#delft)"/>
    </svg>
  </div>
  <div class="head">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <rect width="48" height="48" rx="12" fill="#1E3F9C"/>
      <rect x="9" y="9" width="30" height="30" rx="5" fill="#F4F6FB"/>
      <rect x="12.5" y="12.5" width="23" height="23" rx="3" fill="none" stroke="#1E3F9C" stroke-width="1.3"/>
      <circle cx="24" cy="24" r="6.4" fill="#E8641A"/>
      <path d="M24 20.4v7.2M20.4 24h7.2" stroke="#fff" stroke-width="2.1" stroke-linecap="round"/>
    </svg>
    <div>
      <h1 data-i18n="title">Anki'ye ekle</h1>
      <p class="sub" data-i18n="sub">Hollandaca kartlar</p>
    </div>
    <div class="head-actions">
    <button class="icon-btn" id="helpbtn" type="button" aria-label="Yardım" data-i18n-aria="help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1.1.9-1.1 1.6v.4"/><path d="M12 16.9v.1"/></svg>
    </button>
    <button class="icon-btn" id="gear" type="button" aria-label="Ayarlar" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
    </div>
  </div>
</header>

<main>
  <section>
    <h2 class="lbl" data-i18n="deck">Deste</h2>
    <div class="chips" id="chips"></div>
    <div class="newdeck" id="newrow" hidden>
      <div class="row">
        <input class="input" id="newname" placeholder="Deste adı" data-i18n-ph="deckPh" autocomplete="off">
        <button class="btn" id="newok" type="button" data-i18n="add">Ekle</button>
        <button class="btn quiet" id="newno" type="button" data-i18n="cancel">Vazgeç</button>
      </div>
      <p class="note" data-i18n="deckNote">Desteyi önce Anki'de aynı adla oluştur. Alt deste için Ana::Alt yaz.</p>
    </div>
  </section>

  <div class="paste">
    <textarea id="txt" spellcheck="false" aria-label="Kartlar" data-i18n-aria="cards" data-i18n-ph="pastePh" placeholder="ChatGPT'nin verdiği kod bloğunu buraya yapıştır. Her satır bir kart olur."></textarea>
    <div class="paste-bar">
      <button class="pbtn" id="pastebtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2.5"/><path d="M9 4.5V3.5h6v1M9.5 11h5M9.5 15h5"/></svg>

<script>
// ==PARSER==
function splitCard(line){
  var s=line.trim();
  s=s.replace(/^(?:\d+\s*[.)]|[-*•])\s+/,'');
  if(!s||/^```/.test(s)) return null;
  var front=null,back=null;
  var ci=s.indexOf('}}');
  var start=ci>=0?ci:0;
  var re=/[.!?…]["”']?\s*,/g;
  re.lastIndex=start;
  var m=re.exec(s);
  if(m){
    var cut=m.index+m[0].length;
    front=s.slice(0,cut).replace(/\s*,$/,'');
    back=s.slice(cut);
  }else if(s.charAt(0)==='"'){
    var q=s.match(/^"((?:[^"]|"")*)"\s*,\s*([\s\S]*)$/);
    if(q){front=q[1].replace(/""/g,'"');back=q[2];}
  }
  if(front===null){
    var d=s.match(/^([\s\S]*?)\s*(?:\t|\s\|\s|;)\s*([\s\S]*)$/);
    if(d){front=d[1];back=d[2];}
  }
  if(front===null&&ci>=0){
    var k=s.indexOf(',',ci);
    if(k>0){front=s.slice(0,k);back=s.slice(k+1);}
  }
  if(front===null) return {raw:s,error:'split'};
  front=front.trim();
  if(/^["“]/.test(front)&&/["”]$/.test(front)) front=front.replace(/^["“]+/,'').replace(/["”]+$/,'').trim();
  back=back.replace(/["“”]/g,'').trim().replace(/,(?=\S)/,', ');
  var hasCloze=/\{\{c\d+::/.test(front);
  return {raw:s,front:front,back:back,hasCloze:hasCloze,
    error:!front?'empty':(!hasCloze?'nocloze':null)};
}
function parseAll(text){
  return text.split(/\r?\n/).map(splitCard).filter(Boolean);
}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function enc(t){return encodeURIComponent(t);}
function ankiUrl(cfg,c){
  var u='anki://x-callback-url/addnote?type='+enc(cfg.type)+'&deck='+enc(cfg.deck)
    +'&fld'+enc(cfg.f1)+'='+enc(esc(c.front))
    +'&fld'+enc(cfg.f2)+'='+enc(esc(c.back));
  if(cfg.tags.trim()) u+='&tags='+enc(cfg.tags.trim());
  return u;
}
function bulkText(cfg,cards){
  var tags=cfg.tags.trim();
  var head=['#separator:tab','#html:true','#notetype:'+cfg.type,'#deck:'+cfg.deck];
  if(tags) head.push('#tags column:3');
  var rows=cards.filter(function(c){return !c.error;}).map(function(c){
    var r=esc(c.front).replace(/[\t\r\n]+/g,' ')+'\t'+esc(c.back).replace(/[\t\r\n]+/g,' ');
    if(tags) r+='\t'+tags;
    return r;
  });
  return head.join('\n')+'\n'+rows.join('\n')+'\n';
}
// ==END==

var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
var HELP_IDS=['h-what','h-need','h-setup','h-use','h-fix'];
function hx(v){return esc(String(v));}
function mapHtml(H){
  var rows=[['Cloze',t('noteType'),cfg.type||'Cloze'],['Tekst / Text',t('front'),cfg.f1||'Text'],['Back Extra',t('back'),cfg.f2||'Back Extra']];
  var h='<div class="map"><small>'+hx(H.map_anki)+'</small><span></span><small>'+hx(H.map_app)+'</small>';
  rows.forEach(function(r){h+='<div class="mcell">'+hx(r[0])+'</div><span class="marr" aria-hidden="true">→</span><div class="mcell"><em>'+hx(r[1])+'</em>'+hx(r[2])+'</div>';});
  return h+'</div>';
}
function renderHelp(){
  var H=HELP[lang]||HELP.tr,h='';
  h+='<div class="help-top"><button class="back" type="button" data-act="close">'+CHEV+hx(H.back)+'</button></div>';
  h+='<h1 class="help-h1">'+hx(H.title)+'</h1>';
  h+='<nav class="jump">'+H.jump.map(function(j,i){return '<button type="button" data-to="'+HELP_IDS[i]+'">'+hx(j)+'</button>';}).join('')+'</nav>';
  h+='<section id="h-what"><h2>'+hx(H.s1_t)+'</h2><p>'+hx(H.s1_p)+'</p><ol class="flow">';
  H.flow.forEach(function(f,i){h+='<li><span class="fn">'+(i+1)+'</span><div><b>'+hx(f[0])+'</b><span class="s">'+hx(f[1])+'</span></div></li>';});
  h+='</ol><h3>'+hx(H.fmt_t)+'</h3><div class="fmt"><code class="line"><span class="seg-f">'+hx(EXAMPLE_FRONT)+'</span><span class="seg-c">,</span><span class="seg-b">moppert,"'+hx(H.fmt_mean)+'"</span></code>'
    +'<div class="fmt-out"><div class="fo"><small><i class="dot f"></i>'+hx(H.fmt_front)+'</small><p class="nl">De docent <mark>[…]</mark> omdat de cursisten geen huiswerk hebben.</p></div>'
    +'<div class="fo"><small><i class="dot b"></i>'+hx(H.fmt_back)+'</small><p>moppert, '+hx(H.fmt_mean)+'</p></div></div><p class="cap">'+hx(H.fmt_p)+'</p></div></section>';
  h+='<section id="h-need"><h2>'+hx(H.s2_t)+'</h2><p>'+hx(H.s2_p)+'</p><ul class="checks">';
  H.req.forEach(function(r,i){var on=Array.isArray(cfg.req)&&cfg.req[i];
    h+='<li><label><input type="checkbox" data-req="'+i+'"'+(on?' checked':'')+'><span class="box" aria-hidden="true"></span><div><b>'+hx(r[0])+'</b><span class="s">'+hx(r[1])+'</span></div></label></li>';});
  h+='</ul></section>';
  h+='<section id="h-setup"><h2>'+hx(H.s3_t)+'</h2><p>'+hx(H.s3_p)+'</p><ol class="steps">';
  H.steps3.forEach(function(st,i){
    var x='';
    if(i===0) x='<a class="hbtn" href="'+APPSTORE_URL+'" target="_blank" rel="noopener">'+hx(H.btn_appstore)+'</a>';
    if(i===1) x='<button class="hbtn ghost" type="button" data-act="adddeck">'+hx(H.btn_adddeck)+'</button>';
    if(i===2) x=mapHtml(H)+'<button class="hbtn ghost" type="button" data-act="settings">'+hx(H.btn_settings)+'</button>';
    if(i===3) x='<a class="hbtn" href="'+SHORTCUT_URL+'" target="_blank" rel="noopener">'+hx(H.btn_shortcut)+'</a>'
      +'<details class="more"><summary>'+hx(H.manual_t)+'</summary><div class="acts"><div class="act">Set name of <em>Shortcut Input</em> to <em>kartlar.csv</em></div><div class="act">Open <em>Renamed Item</em> in <em>Anki</em></div></div>'
      +'<ol class="sub">'+H.manual_steps.map(function(m){return '<li>'+hx(m)+'</li>';}).join('')+'</ol><p class="cap">'+hx(H.manual_note)+'</p></details>';
    if(i===4) x='<button class="hbtn" type="button" data-copy="instr">'+hx(H.btn_copy)+'</button>'
      +'<details class="more"><summary>'+hx(H.show_instr)+'</summary><pre class="instr">'+hx(INSTR[lang]||INSTR.tr)+'</pre></details>'
      +'<h4>'+hx(H.where_t)+'</h4><ul class="where">'+H.where.map(function(w){return '<li>'+hx(w)+'</li>';}).join('')+'</ul>';
    if(i===5) x='<div class="path">'+H.path.map(function(q){return '<span>'+hx(q)+'</span>';}).join('<i aria-hidden="true">›</i>')+'</div>';
    h+='<li><span class="sn">'+(i+1)+'</span><div class="sb"><h3>'+hx(st[0])+'</h3><p>'+hx(st[1])+'</p>'+x+'</div></li>';
  });
  h+='</ol></section>';
  h+='<section id="h-use"><h2>'+hx(H.s4_t)+'</h2><ol class="steps">';
  H.steps4.forEach(function(st,i){h+='<li><span class="sn">'+(i+1)+'</span><div class="sb"><h3>'+hx(st[0])+'</h3><p>'+hx(st[1])+'</p></div></li>';});
  h+='</ol><div class="tip"><h3>'+hx(H.tip_bulk_t)+'</h3><p>'+hx(H.tip_bulk)+'</p><div class="trig"><span class="kbd">'+hx(H.trigger)+'</span><button class="hbtn ghost sm" type="button" data-copy="trigger">'+hx(H.btn_copy_trigger)+'</button></div></div>'
    +'<p class="cap">'+hx(H.tip_single)+'</p></section>';
  h+='<section id="h-fix"><h2>'+hx(H.s5_t)+'</h2>'+H.faq.map(function(f){return '<details class="faq"><summary>'+hx(f[0])+'</summary><p>'+hx(f[1])+'</p></details>';}).join('')+'</section>';
  h+='<p class="ver">'+hx(t('version'))+'</p>';
  $('help').innerHTML=h;
}
function fallbackCopy(txt){
  var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');
  ta.style.position='absolute';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();
  var r=false;try{r=document.execCommand('copy');}catch(e){}ta.remove();return r;
}
function copyText(txt,btn){
  var H=HELP[lang]||HELP.tr;
  if(!btn.getAttribute('data-orig'))btn.setAttribute('data-orig',btn.textContent);
  function ok(){btn.textContent=H.copied;toast(H.copied);setTimeout(function(){btn.textContent=btn.getAttribute('data-orig');},1600);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){if(fallbackCopy(txt))ok();});}
  else if(fallbackCopy(txt))ok();
}
var helpPushed=false;
function showHelp(on){
  document.body.classList.toggle('in-help',on);
  if(on){renderHelp();window.scrollTo(0,0);}
}
function closeHelp(then){
  if(helpPushed){helpPushed=false;history.back();}else{location.hash='';}
  if(then)setTimeout(then,200);
}

var KEY='anki-ekle-v1';
var cfg={deck:'',decks:[],type:'Cloze',f1:'Tekst',f2:'Back Extra',tags:'',sc_name:'Anki Aktar'};
var draft={text:'',sent:[]};
try{var s1=JSON.parse(localStorage.getItem(KEY+'-cfg')||'null');if(s1)for(var k in s1)cfg[k]=s1[k];}catch(e){}
try{var s2=JSON.parse(localStorage.getItem(KEY+'-draft')||'null');if(s2){draft.text=s2.text||'';draft.sent=s2.sent||[];}}catch(e){}
if(!Array.isArray(cfg.decks))cfg.decks=[];
if(!cfg.sc_name)cfg.sc_name='Anki Aktar';
lang=I18N[cfg.lang]?cfg.lang:'tr';
if(cfg.deck&&cfg.decks.indexOf(cfg.deck)<0)cfg.decks.unshift(cfg.deck);
function saveCfg(){try{localStorage.setItem(KEY+'-cfg',JSON.stringify(cfg));}catch(e){}}
function saveDraft(){try{localStorage.setItem(KEY+'-draft',JSON.stringify(draft));}catch(e){}}

var $=function(id){return document.getElementById(id);};
var toastTimer;
function toast(msg){
  var t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},3200);
}

/* settings sheet */
function openSheet(){var w=$('sheetwrap');w.hidden=false;requestAnimationFrame(function(){requestAnimationFrame(function(){w.classList.add('open');});});}
function closeSheet(){var w=$('sheetwrap');w.classList.remove('open');setTimeout(function(){w.hidden=true;},280);}
$('gear').addEventListener('click',openSheet);
$('done').addEventListener('click',closeSheet);
$('scrim').addEventListener('click',closeSheet);
['type','f1','f2','tags','sc_name'].forEach(function(id){
  $(id).value=cfg[id];
  $(id).addEventListener('input',function(){cfg[id]=$(id).value;saveCfg();render();});
});

/* decks */
function renderChips(){
  var box=$('chips');box.innerHTML='';
  cfg.decks.forEach(function(d){
    var b=document.createElement('button');
    b.type='button';b.className='chip'+(d===cfg.deck?' on':'');b.textContent=d;
    b.setAttribute('aria-pressed',d===cfg.deck?'true':'false');
    b.addEventListener('click',function(){cfg.deck=d;saveCfg();renderChips();render();});
    box.appendChild(b);
  });
  var add=document.createElement('button');
  add.type='button';add.className='chip add';add.textContent=t('newDeck');
  add.addEventListener('click',function(){$('newrow').hidden=false;$('newname').focus();});
  box.appendChild(add);
  if(!cfg.decks.length){$('newrow').hidden=false;$('newno').hidden=true;}else{$('newno').hidden=false;}
  renderDeckAdmin();
}
function renderDeckAdmin(){
  var box=$('deckadmin');box.innerHTML='';
  cfg.decks.forEach(function(d){
    var row=document.createElement('div');row.className='dk';
    var n=document.createElement('span');n.textContent=d;row.appendChild(n);
    var rm=document.createElement('button');rm.type='button';rm.textContent=t('remove');
        rm.addEventListener('click',function(){
      cfg.decks=cfg.decks.filter(function(x){return x!==d;});
      if(cfg.deck===d)cfg.deck=cfg.decks[0]||'';
      saveCfg();renderChips();render();
    });
    row.appendChild(rm);box.appendChild(row);
  });
}
function closeNew(){$('newname').value='';if(cfg.decks.length)$('newrow').hidden=true;}
$('newok').addEventListener('click',function(){
  var n=$('newname').value.trim().replace(/\s*::\s*/g,'::');
  if(!n){$('newname').focus();return;}
  if(cfg.decks.indexOf(n)<0)cfg.decks.push(n);
  cfg.deck=n;closeNew();saveCfg();renderChips();render();
});
$('newname').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('newok').click();}});
$('newno').addEventListener('click',closeNew);

/* text input */
function setText(v){$('txt').value=v;draft.text=v;draft.sent=[];saveDraft();render();}
$('txt').value=draft.text;
$('txt').addEventListener('input',function(){draft.text=$('txt').value;draft.sent=[];saveDraft();render();});
$('clear').addEventListener('click',function(){setText('');});
$('pastebtn').addEventListener('click',function(){
  if(!(navigator.clipboard&&navigator.clipboard.readText)){$('txt').focus();return;}
  navigator.clipboard.readText().then(function(t){
    if(!t){toast(t('toastEmpty'));return;}
    var cur=$('txt').value;
    setText(cur?cur.replace(/\s*$/,'')+'\n'+t:t);
  }).catch(function(){$('txt').focus();});
});

/* export */
function downloadBulk(){
  var text=bulkText(cfg,parseAll(draft.text));
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  a.download='anki-kartlar-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}
$('dl').addEventListener('click',downloadBulk);

var okIdx=[];
$('sc').addEventListener('click',function(e){
  if($('sc').classList.contains('off')){e.preventDefault();return;}
  var all=okIdx.slice();
  setTimeout(function(){draft.sent=all;saveDraft();render();},400);
  toast(t('toastGo'));
});
function markSent(i){
  if(draft.sent.indexOf(i)<0)draft.sent.push(i);
  saveDraft();setTimeout(render,400);
}

var SEND_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6"/></svg>';

function render(){
  var cards=parseAll(draft.text);
  var list=$('list');list.innerHTML='';
  var ok=0,bad=0,done=0;okIdx=[];var hasDeck=!!cfg.deck;
  cards.forEach(function(c,i){
    var el=document.createElement('article');
    var isSent=draft.sent.indexOf(i)>=0;
    var html,foot;
    if(c.error){
      bad++;el.className='tile bad';
      html='<p class="nl">'+esc(c.raw)+'</p>';
      foot='<span class="st err">'+esc(t('err_'+c.error))+'</span>';
    }else{
      ok++;okIdx.push(i);if(isSent)done++;
      el.className='tile'+(isSent?' sent':'');
      var fr=esc(c.front).replace(/\{\{c\d+::([\s\S]*?)(?:::[\s\S]*?)?\}\}/g,'<mark>$1</mark>');
      html='<p class="nl">'+fr+'</p>'+(c.back?'<p class="tr">'+esc(c.back)+'</p>':'');
      foot=(isSent?'<span class="st ok">'+t('stSent')+'</span>':'<span class="st">'+t('stReady')+'</span>')
        +(hasDeck?'<a class="mini" data-i="'+i+'" href="'+ankiUrl(cfg,c).replace(/&/g,'&amp;')+'">'+t('single')+'</a>':'');
    }
    el.innerHTML=html+'<div class="foot">'+foot+'</div>';
    list.appendChild(el);
  });
  Array.prototype.forEach.call(list.querySelectorAll('a[data-i]'),function(a){
    a.addEventListener('click',function(){markSent(parseInt(a.getAttribute('data-i'),10));});
  });

  var sum='';
  if(cards.length){
    sum='<b>'+tn('ready1','readyN',ok)+'</b>';
    if(bad) sum+=', '+tn('bad1','badN',bad);
    if(done) sum+=', '+tn('sent1','sentN',done);
    if(hasDeck) sum+='. '+t('target')+': '+esc(cfg.deck);
  }
  $('sum').innerHTML=sum;

  var sc=$('sc');
  if(ok&&hasDeck){
    sc.classList.remove('off');sc.removeAttribute('aria-disabled');
    sc.setAttribute('href','shortcuts://run-shortcut?name='+enc(cfg.sc_name.trim()||'Anki Aktar')+'&input=text&text='+enc(bulkText(cfg,cards)));
    sc.innerHTML=esc(done===ok?t('again'):tn('cta1','ctaN',ok))+SEND_ICON;
  }else{
    sc.classList.add('off');sc.setAttribute('aria-disabled','true');sc.setAttribute('href','#');
    sc.textContent=ok?t('needDeck'):t('ctaOff');
  }
  $('dl').disabled=!ok||!hasDeck;
}

Array.prototype.forEach.call(document.querySelectorAll('#langs button'),function(b){
  b.addEventListener('click',function(){lang=b.getAttribute('data-lang');cfg.lang=lang;saveCfg();applyLang();renderChips();render();if(document.body.classList.contains('in-help'))renderHelp();});
});
$('helpbtn').addEventListener('click',function(){helpPushed=true;location.hash='help';});
window.addEventListener('hashchange',function(){if(location.hash!=='#help')helpPushed=false;showHelp(location.hash==='#help');});
$('help').addEventListener('click',function(e){
  var el=e.target.closest('[data-to],[data-act],[data-copy]');if(!el)return;
  if(el.hasAttribute('data-to')){var sec=document.getElementById(el.getAttribute('data-to'));
    if(sec)sec.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
  var act=el.getAttribute('data-act');
  if(act==='close'){closeHelp();return;}
  if(act==='adddeck'){closeHelp(function(){$('newrow').hidden=false;$('newname').focus();});return;}
  if(act==='settings'){closeHelp(openSheet);return;}
  var cp=el.getAttribute('data-copy');
  if(cp==='instr')copyText(INSTR[lang]||INSTR.tr,el);
  if(cp==='trigger')copyText((HELP[lang]||HELP.tr).trigger,el);
});
$('help').addEventListener('change',function(e){
  var i=e.target.getAttribute&&e.target.getAttribute('data-req');if(i==null)return;
  if(!Array.isArray(cfg.req))cfg.req=[];cfg.req[+i]=e.target.checked;saveCfg();
});
applyLang();
renderChips();
render();
showHelp(location.hash==='#help');
</script>
</body>
</html>
